name: Simple Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Test build
      run: |
        echo "Testing build output..."
        ls -la
        if [ -d "dist" ]; then
          echo "✅ Build successful!"
          ls -la dist/
        else
          echo "❌ Build failed!"
          exit 1
        fi 