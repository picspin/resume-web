name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Pages after repository Pages setup is confirmed
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install required test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run linting
        run: npm run lint
      - name: Run resume tests
        run: npm run resume:test
      - name: Run career tests
        timeout-minutes: 5
        run: npm run career:test
      - name: Verify private production build (not published to Pages)
        run: npm run build:private
      - name: Test authenticated Node service and private UI
        env:
          RUN_PRIVATE_UI_TEST: '1'
        run: npm run server:test
      - name: Build public production site
        env:
          VITE_BASE_PATH: /resume-web/
        run: npm run build
      - name: Upload validated Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, security-scan]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level moderate
